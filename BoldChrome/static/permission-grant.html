<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Camera Permission</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			padding: 24px;
		}

		.content {
			background: white;
			padding: 48px;
			border-radius: 16px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			text-align: center;
			max-width: 500px;
		}

		h1 {
			font-size: 28px;
			font-weight: 700;
			color: #000000;
			margin: 0 0 16px 0;
		}

		.status {
			font-size: 18px;
			font-weight: 600;
			color: #1a1a1a;
			margin-bottom: 16px;
		}

		.status.error {
			color: #dc2626;
		}

		.status.success {
			color: #16a34a;
		}

		.instructions {
			font-size: 16px;
			color: #4b5563;
			line-height: 1.6;
			margin-bottom: 24px;
		}

		.spinner {
			display: inline-block;
			width: 40px;
			height: 40px;
			border: 4px solid #e5e7eb;
			border-top-color: #667eea;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin: 16px auto;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}
	</style>
</head>
<body>
	<div class="permission-page">
		<div class="content">
			<h1>Camera Permission Setup</h1>
			<div class="spinner"></div>
			<p class="status" id="status">Requesting camera permission...</p>
			<p class="instructions" id="instructions">Please click <strong>"Allow"</strong> when your browser asks for camera access.</p>
		</div>
	</div>

	<script>
		(async () => {
			const statusEl = document.getElementById('status');
			const instructionsEl = document.getElementById('instructions');
			const spinner = document.querySelector('.spinner');

			try {
				// Request camera permission
				const stream = await navigator.mediaDevices.getUserMedia({ video: true });
				
				// Success! Stop the stream immediately
				stream.getTracks().forEach(track => track.stop());
				
				statusEl.textContent = 'Success! Camera permission granted.';
				statusEl.classList.add('success');
				spinner.style.display = 'none';
				instructionsEl.textContent = 'You can now close this tab and scan QR codes.';
				
				// Notify popup that permission was granted
				chrome.storage.local.set({ cameraPermissionGranted: true });
				
				// Close this tab after a short delay
				setTimeout(() => {
					window.close();
				}, 1500);
			} catch (err) {
				console.error('Permission error:', err);
				statusEl.textContent = 'Permission denied';
				statusEl.classList.add('error');
				spinner.style.display = 'none';
				instructionsEl.textContent = 'Please allow camera access and try again from the extension popup.';
			}
		})();
	</script>
</body>
</html>
